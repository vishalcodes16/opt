name: Build Vishal X Opt

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore VishalXOpt/VishalXOpt.sln

      - name: Build
        run: dotnet build VishalXOpt/VishalXOpt.sln -c Release --no-restore

      - name: Test
        run: dotnet test VishalXOpt/VishalXOpt.sln -c Release --no-build

      - name: Publish Windows x64
        run: >
          dotnet publish
          VishalXOpt/src/VishalXOpt.App/VishalXOpt.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          /p:PublishTrimmed=false
          -o publish

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VishalXOpt-Windows-x64
          path: publish/
          if-no-files-found: error
